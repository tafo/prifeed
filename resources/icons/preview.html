<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prifeed icon preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px;
        font-family: system-ui, sans-serif;
        background: #14171c;
        color: #abb2bf;
      }
      h1 {
        font-size: 14px;
        font-weight: 500;
        margin: 0 0 8px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #7f848e;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 32px;
        padding: 24px 0;
        border-bottom: 1px solid #2a2f37;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .label {
        width: 140px;
        font-size: 13px;
        color: #abb2bf;
      }
      .sizes {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .sizes img {
        display: block;
      }
      .size-label {
        font-size: 11px;
        color: #5c6370;
        margin-top: 6px;
        text-align: center;
        font-family: ui-monospace, monospace;
      }
      .size {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Prifeed icons — preview at multiple sizes</h1>

    <div class="row">
      <div class="label">A · Monogram P</div>
      <div class="sizes">
        <div class="size">
          <img src="icon-a-monogram.svg" width="16" height="16" />
          <div class="size-label">16</div>
        </div>
        <div class="size">
          <img src="icon-a-monogram.svg" width="32" height="32" />
          <div class="size-label">32</div>
        </div>
        <div class="size">
          <img src="icon-a-monogram.svg" width="64" height="64" />
          <div class="size-label">64</div>
        </div>
        <div class="size">
          <img src="icon-a-monogram.svg" width="128" height="128" />
          <div class="size-label">128</div>
        </div>
        <div class="size">
          <img src="icon-a-monogram.svg" width="256" height="256" />
          <div class="size-label">256</div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="label">B · Timeline</div>
      <div class="sizes">
        <div class="size">
          <img src="icon-b-timeline.svg" width="16" height="16" />
          <div class="size-label">16</div>
        </div>
        <div class="size">
          <img src="icon-b-timeline.svg" width="32" height="32" />
          <div class="size-label">32</div>
        </div>
        <div class="size">
          <img src="icon-b-timeline.svg" width="64" height="64" />
          <div class="size-label">64</div>
        </div>
        <div class="size">
          <img src="icon-b-timeline.svg" width="128" height="128" />
          <div class="size-label">128</div>
        </div>
        <div class="size">
          <img src="icon-b-timeline.svg" width="256" height="256" />
          <div class="size-label">256</div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="label">D · T (circles)</div>
      <div class="sizes">
        <div class="size">
          <img src="icon-d-t-letter.svg" width="16" height="16" />
          <div class="size-label">16</div>
        </div>
        <div class="size">
          <img src="icon-d-t-letter.svg" width="32" height="32" />
          <div class="size-label">32</div>
        </div>
        <div class="size">
          <img src="icon-d-t-letter.svg" width="64" height="64" />
          <div class="size-label">64</div>
        </div>
        <div class="size">
          <img src="icon-d-t-letter.svg" width="128" height="128" />
          <div class="size-label">128</div>
        </div>
        <div class="size">
          <img src="icon-d-t-letter.svg" width="256" height="256" />
          <div class="size-label">256</div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="label">C · Stacked frames</div>
      <div class="sizes">
        <div class="size">
          <img src="icon-c-stacked.svg" width="16" height="16" />
          <div class="size-label">16</div>
        </div>
        <div class="size">
          <img src="icon-c-stacked.svg" width="32" height="32" />
          <div class="size-label">32</div>
        </div>
        <div class="size">
          <img src="icon-c-stacked.svg" width="64" height="64" />
          <div class="size-label">64</div>
        </div>
        <div class="size">
          <img src="icon-c-stacked.svg" width="128" height="128" />
          <div class="size-label">128</div>
        </div>
        <div class="size">
          <img src="icon-c-stacked.svg" width="256" height="256" />
          <div class="size-label">256</div>
        </div>
      </div>
    </div>
  </body>
</html>
